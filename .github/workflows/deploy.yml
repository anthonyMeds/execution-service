name: Deploy

# Deploy automatizado no Kubernetes, como exige a Fase 4.
# Roda so depois que o CI passou na main.
#
# A imagem vai para o ECR da propria conta do Learner Lab, como no OS Service e no
# Billing: o cluster puxa do ECR com a role dos nodes, sem credencial de registro.
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN (expiram a
# cada sessao do Lab). Variaveis opcionais: AWS_REGION e EKS_CLUSTER_NAME.
on:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

concurrency:
  group: deploy-eks
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'oficina-eks' }}
  ECR_REPOSITORIO: oficina-execution
  # No workflow_run, github.sha e o ultimo commit da main, nao o que o CI testou
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Repositorio no ECR
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORIO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORIO" >/dev/null

      # O Dockerfile compila e roda o Maven dentro dele: nao precisa de Java no runner.
      # Tag imutavel pelo commit, para o rollout saber exatamente o que subiu.
      - name: Build e push da imagem
        id: imagem
        run: |
          IMAGEM="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORIO}:${COMMIT::7}"
          docker build -t "$IMAGEM" .
          docker push "$IMAGEM"
          echo "nome=$IMAGEM" >> "$GITHUB_OUTPUT"

      - name: Conectar no cluster EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Conferir o RabbitMQ do OS Service
        run: |
          # A fila deste servico fica no RabbitMQ que o OS Service implanta
          if ! kubectl get statefulset/rabbitmq -n oficina >/dev/null 2>&1; then
            echo "::error::RabbitMQ nao encontrado no namespace oficina: implante o OS Service antes"
            exit 1
          fi

      - name: Aplicar manifests
        env:
          IMAGEM: ${{ steps.imagem.outputs.nome }}
        run: |
          kubectl apply -f k8s/06-mongodb.yaml
          # O Instrumentation precisa existir antes do pod subir, senao o agent nao e injetado.
          # Sem o New Relic instalado no cluster o CRD nao existe: avisa e segue sem APM.
          if kubectl get crd instrumentations.newrelic.com >/dev/null 2>&1; then
            kubectl apply -f k8s/07-newrelic-instrumentation.yaml
          else
            echo "::warning::New Relic nao instalado no cluster: execution-service sobe sem APM."
          fi
          kubectl apply -f k8s/01-configmap.yaml
          # A imagem entra no proprio apply: sem um pod intermediario com a imagem padrao
          # do manifest (que nao existe no ECR e ficaria em ImagePullBackOff)
          sed "s|image: anthonymeds/oficina-execution:latest|image: ${IMAGEM}|" k8s/03-deployment.yaml \
            | kubectl apply -f -
          kubectl apply -f k8s/04-service-loadbalancer.yaml
          kubectl apply -f k8s/05-hpa.yaml
          kubectl rollout status deployment/mongodb -n oficina --timeout=300s
          kubectl rollout status deployment/execution-service -n oficina --timeout=300s

      - name: Conferir a imagem em execucao
        env:
          IMAGEM: ${{ steps.imagem.outputs.nome }}
        run: |
          APLICADA=$(kubectl get deployment execution-service -n oficina \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="execution-service")].image}')
          if [ "$APLICADA" != "$IMAGEM" ]; then
            echo "::error::Deployment com a imagem $APLICADA, esperada $IMAGEM"
            exit 1
          fi
          echo "Deploy concluido: $IMAGEM" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostico
        if: failure()
        run: |
          kubectl get pods,svc,hpa -n oficina || true
          kubectl get events -n oficina --sort-by=.metadata.creationTimestamp | tail -30 || true
          kubectl logs deployment/execution-service -n oficina --tail=100 || true
