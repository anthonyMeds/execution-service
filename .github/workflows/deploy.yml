name: Deploy

# Deploy automatizado no Kubernetes, como exige a Fase 4.
# Roda so depois que o CI passou na main.
on:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empacotar
        run: mvn -B clean package -DskipTests

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oficina-execution:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/oficina-execution:${{ github.sha }}

      # As credenciais do Learner Lab expiram a cada sessao, entao os tres
      # secrets precisam ser atualizados antes de rodar o deploy.
      - name: Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Conectar no cluster EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region us-east-1

      - name: Aplicar manifests
        run: |
          kubectl apply -f k8s/06-mongodb.yaml
          # O Instrumentation precisa existir antes do pod subir, senao o agent nao e injetado.
          # Sem o New Relic instalado no cluster o CRD nao existe: avisa e segue sem APM.
          if kubectl get crd instrumentations.newrelic.com >/dev/null 2>&1; then
            kubectl apply -f k8s/07-newrelic-instrumentation.yaml
          else
            echo "::warning::New Relic nao instalado no cluster: execution-service sobe sem APM."
          fi
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/03-deployment.yaml
          kubectl apply -f k8s/04-service-loadbalancer.yaml
          kubectl apply -f k8s/05-hpa.yaml
          kubectl set image deployment/execution-service \
            execution-service=${{ secrets.DOCKERHUB_USERNAME }}/oficina-execution:${{ github.sha }} \
            -n oficina
          kubectl rollout status deployment/execution-service -n oficina --timeout=300s
