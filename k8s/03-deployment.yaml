apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: oficina
  labels:
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-service
        app.kubernetes.io/component: api
      annotations:
        # Mesma instrumentacao automatica do New Relic usada na Fase 3: o
        # k8s-agents-operator injeta o APM agent sem tocar no Dockerfile.
        instrumentation.newrelic.com/inject-java: "true"
    spec:
      containers:
        - name: execution-service
          image: anthonymeds/oficina-execution:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NEW_RELIC_APP_NAME
              value: "execution-service"
            - name: NEW_RELIC_LABELS
              value: "env:aws-academy;repo:execution-service"
          envFrom:
            - configMapRef:
                name: execution-config
            - secretRef:
                name: execution-secret
          # O actuator expoe probes dedicados; nao usamos um endpoint de
          # negocio como health check.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 75
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
