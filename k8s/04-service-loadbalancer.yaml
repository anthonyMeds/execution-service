apiVersion: v1
kind: Service
metadata:
  name: execution-service-lb
  namespace: oficina
  labels:
    app.kubernetes.io/name: execution-service
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
