spring:
  application:
    name: execution

  # Atencao: no Spring Boot 4 a conexao do Mongo fica em spring.mongodb.*
  # (o antigo spring.data.mongodb.uri foi descontinuado e e ignorado).
  mongodb:
    # Local: o Mongo do docker-compose. No cluster: a URI do Atlas, vinda do
    # Secret do Kubernetes na variavel MONGODB_URI -- nunca escrita aqui.
    uri: ${MONGODB_URI:mongodb://localhost:27017/oficina_execution}
  data:
    mongodb:
      # Cria os indices unicos declarados nas classes de model (@Indexed).
      auto-index-creation: true

  # O mesmo broker do OS Service e do Billing. No cluster, os valores vem das
  # variaveis SPRING_RABBITMQ_HOST, SPRING_RABBITMQ_USERNAME e SPRING_RABBITMQ_PASSWORD,
  # que o Spring aplica por cima destes automaticamente.
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

oficina:
  mensageria:
    # log    -> nao usa broker; os eventos so aparecem no log (padrao)
    # rabbit -> publica e consome no RabbitMQ
    tipo: ${OFICINA_MENSAGERIA_TIPO:log}

server:
  port: ${SERVER_PORT:8080}

# Swagger sob o mesmo prefixo dos controllers (/execution/v1): assim a rota
# /execution/v1/{proxy+} do API Gateway tambem alcanca a documentacao.
springdoc:
  api-docs:
    path: /execution/v1/api-docs
  swagger-ui:
    path: /execution/v1/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    br.com.oficina.execution: INFO
  pattern:
    # %X{correlationId} imprime, em toda linha, o id da requisicao.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
